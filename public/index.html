<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora AWS - Básica</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Calculadora</h1>
    <p class="subtitle">Desplegada en AWS EC2 (Node.js + Express)</p>

    <div class="form-group">
      <label for="num1">Número 1</label>
      <input type="number" id="num1" placeholder="Ej: 10">
    </div>

    <div class="form-group">
      <label for="num2">Número 2</label>
      <input type="number" id="num2" placeholder="Ej: 5">
    </div>

    <div class="form-group">
      <label for="operacion">Operación</label>
      <select id="operacion">
        <option value="suma">Suma (+)</option>
        <option value="resta">Resta (-)</option>
        <option value="multiplicacion">Multiplicación (×)</option>
        <option value="division">División (÷)</option>
      </select>
    </div>

    <button id="calcular">Calcular</button>

    <div class="resultado-box">
      <span>Resultado:</span>
      <strong id="resultado">--</strong>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
